<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7f2">
    <title>Växelräknaren</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #18251e;
            background: #f4f7f2;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 10% 5%, rgba(192, 222, 196, .45), transparent 35%),
                radial-gradient(ellipse at 95% 95%, rgba(231, 218, 179, .35), transparent 30%),
                #f4f7f2;
        }

        .calculator {
            width: min(100%, 520px);
            padding: clamp(24px, 6vw, 44px);
            border: 1px solid rgba(31, 58, 43, .09);
            border-radius: 24px;
            background: rgba(255, 255, 255, .92);
            box-shadow: 0 24px 70px rgba(34, 55, 41, .10);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #55735f;
            font-size: .75rem;
            font-weight: 750;
            letter-spacing: .13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 2.7rem);
            letter-spacing: -.055em;
            line-height: 1.05;
        }

        .intro {
            margin: 13px 0 30px;
            color: #65736a;
            font-size: .98rem;
            line-height: 1.6;
        }

        .fields { display: grid; gap: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: .9rem;
            font-weight: 700;
        }

        .input-wrap { position: relative; }

        input {
            width: 100%;
            min-height: 56px;
            padding: 12px 56px 12px 16px;
            border: 1px solid #dce5dc;
            border-radius: 12px;
            outline: none;
            background: #fbfcfa;
            color: #18251e;
            font: inherit;
            font-size: 1.1rem;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }

        input:focus {
            border-color: #4b7959;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(75, 121, 89, .13);
        }

        .currency {
            position: absolute;
            top: 50%;
            right: 16px;
            color: #758178;
            font-weight: 650;
            transform: translateY(-50%);
            pointer-events: none;
        }

        button {
            width: 100%;
            min-height: 54px;
            margin-top: 24px;
            border: 0;
            border-radius: 12px;
            background: #245c38;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 1rem;
            font-weight: 750;
            transition: background .15s, transform .15s;
        }

        button:hover { background: #19482b; }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: 3px solid #8dbb97; outline-offset: 3px; }

        .result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 14px;
            background: #f1f6f0;
        }

        .result[hidden] { display: none; }

        .result h2 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: -.01em;
        }

        .result-total {
            margin: 8px 0 0;
            color: #245c38;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.05em;
        }

        .denominations {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }

        .denominations li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid #e2eae1;
            border-radius: 9px;
            background: rgba(255, 255, 255, .8);
            font-size: .9rem;
        }

        .denominations strong { white-space: nowrap; }

        .message {
            margin: 0;
            color: #3f5d49;
            line-height: 1.5;
        }

        .message.error { color: #9c352e; }

        .note {
            margin: 20px 0 0;
            color: #7a857c;
            font-size: .78rem;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 420px) {
            body { padding: 24px 14px; }
            .denominations { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="calculator">
        <p class="eyebrow">Snabbt och enkelt</p>
        <h1>Växelräknaren</h1>
        <p class="intro">Fyll i kostnaden och hur mycket kunden betalade. Vi räknar ut växeln med minsta möjliga antal sedlar och mynt.</p>

        <form id="change-form" novalidate>
            <div class="fields">
                <div>
                    <label for="cost">Kostnad</label>
                    <div class="input-wrap">
                        <input id="cost" name="cost" type="number" min="0" step="1" inputmode="numeric" placeholder="Till exempel 138" required>
                        <span class="currency" aria-hidden="true">kr</span>
                    </div>
                </div>
                <div>
                    <label for="paid">Betalat</label>
                    <div class="input-wrap">
                        <input id="paid" name="paid" type="number" min="0" step="1" inputmode="numeric" placeholder="Till exempel 200" required>
                        <span class="currency" aria-hidden="true">kr</span>
                    </div>
                </div>
            </div>
            <button type="submit">Räkna ut växel</button>
        </form>

        <section id="result" class="result" aria-live="polite" aria-atomic="true" hidden></section>
        <p class="note">Beräkningen använder svenska valörer från 1 till 1 000 kronor.</p>
    </main>

    <script>
        const form = document.querySelector('#change-form');
        const result = document.querySelector('#result');
        const denominations = [1000, 500, 200, 100, 50, 20, 10, 5, 2, 1];

        function formatAmount(amount) {
            return new Intl.NumberFormat('sv-SE').format(amount);
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const costInput = document.querySelector('#cost');
            const paidInput = document.querySelector('#paid');
            const cost = Number(costInput.value);
            const paid = Number(paidInput.value);

            result.hidden = false;

            if (costInput.value === '' || paidInput.value === '' || !Number.isSafeInteger(cost) || !Number.isSafeInteger(paid) || cost < 0 || paid < 0) {
                result.innerHTML = '<p class="message error">Ange kostnad och betalning som heltal på 0 eller mer.</p>';
                return;
            }

            if (paid < cost) {
                result.innerHTML = `<p class="message error">Betalningen räcker inte. Det saknas <strong>${formatAmount(cost - paid)} kr</strong>.</p>`;
                return;
            }

            let change = paid - cost;
            if (change === 0) {
                result.innerHTML = '<h2>Jämna pengar</h2><p class="message">Ingen växel ska lämnas tillbaka.</p>';
                return;
            }

            const total = change;
            const breakdown = denominations
                .map((value) => {
                    const count = Math.floor(change / value);
                    change %= value;
                    return { value, count };
                })
                .filter(({ count }) => count > 0)
                .map(({ value, count }) => {
                    const unit = value >= 20 ? 'sedel' : 'mynt';
                    const unitLabel = count === 1 ? unit : `${unit} (${unit === 'sedel' ? 'sedlar' : 'mynt'})`;
                    return `<li><span>${formatAmount(value)} kr ${unitLabel}</span><strong>${count} st</strong></li>`;
                })
                .join('');

            result.innerHTML = `<h2>Växel att lämna tillbaka</h2><p class="result-total">${formatAmount(total)} kr</p><ul class="denominations">${breakdown}</ul>`;
        });
    </script>
</body>
</html>
